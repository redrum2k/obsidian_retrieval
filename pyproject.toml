[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vault-retrieval"
version = "0.1.0"
description = "Local, bounded Obsidian evidence retrieval and approved processing"
requires-python = ">=3.12"
dependencies = ["tiktoken>=0.9,<1", "PyMuPDF>=1.25,<2", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "PyYAML>=6,<7", "cryptography>=44,<47"]

[project.scripts]
vault = "vault_retrieval.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
